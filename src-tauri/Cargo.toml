[package]
name = "the-tunnel"
version = "0.5.2"
description = "Move files between your devices over the local network"
authors = ["Tungon Dugi <tungondugi@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "the_tunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tunnel-core = { path = "../crates/tunnel-core" }
tauri-plugin-dialog = "2.8.2"
tokio = { version = "1.53.2", features = ["sync"] }
anyhow = "1.0.104"
window-vibrancy = "0.8.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.6.0"
tauri-plugin-single-instance = "2.5.3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"


