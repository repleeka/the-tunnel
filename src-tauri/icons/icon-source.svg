<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7C78F5"/>
      <stop offset="1" stop-color="#3426B0"/>
    </linearGradient>
    <radialGradient id="depth" cx="0.5" cy="0.53" r="0.5">
      <stop offset="0" stop-color="#1B1466" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1B1466" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1B1466" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#C9C6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Body -->
  <circle cx="512" cy="512" r="448" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="448" fill="url(#depth)"/>
  <!-- Tunnel rings, each slightly lower to suggest depth -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="512" cy="512" r="352" stroke-width="40" stroke-opacity="0.95"/>
    <circle cx="512" cy="530" r="250" stroke-width="32" stroke-opacity="0.7"/>
    <circle cx="512" cy="544" r="160" stroke-width="24" stroke-opacity="0.45"/>
    <circle cx="512" cy="552" r="86" stroke-width="16" stroke-opacity="0.25"/>
  </g>
  <!-- Light at the end -->
  <circle cx="512" cy="556" r="96" fill="url(#light)"/>
  <circle cx="512" cy="556" r="30" fill="#FFFFFF"/>
</svg>
